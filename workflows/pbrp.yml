      - name: Initialize PBRP Manifest
        run: |
          mkdir work
          cd work
          # Инициализируем ОРИГИНАЛЬНУЮ базу PBRP
          repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb -b android-12.1 --depth=1
          # 2. Создаем папку для твоего кастомного манифеста
          mkdir -p .repo/local_manifests
          cp ../pbrp-default.xml .repo/local_manifests/pbrp-default.xml
          
      - name: Repo Sync
        run: |
          cd work
          # Синхронизация с учетом локального манифеста
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Clone Device Tree
        run: |
          cd work
          git clone ${{ github.server_url }}/${{ github.repository }} -b main device/tecno/le7n

      - name: Building PBRP
        run: |
          cd work
          . build/envsetup.sh
          lunch pb_tecno_le7n-eng            # ЗАПУСК
          mka pbrp -j$(nproc --all)
