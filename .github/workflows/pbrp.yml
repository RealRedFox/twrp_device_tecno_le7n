name: PBRP Build Silver Fox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cleanup & Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc bison build-essential curl flex g++-multilib gcc-multilib gettext git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Install Repo Tool
        run: |
          sudo apt-get update
          sudo apt-get install repo -y

      - name: Initialize PBRP Manifest
        run: |
          # 1. Форсируем создание папки
          mkdir -pv work
          cd work
          # 2. Настраиваем Git максимально жестко, чтобы не было вопросов
          git config --global user.name "SilverFox"
          git config --global user.email "silver@fox.com"
          git config --global color.ui false
          # 3. Инициализация с флагом --no-pager (критично!)
          echo "Starting repo init..."
          repo init --no-pager --no-clone-bundle --depth=1 \
          -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git \
          -b pb-12.1
          # 4. Локальный манифест
          echo "Setting up local manifest..."
          mkdir -p .repo/local_manifests
          cp ../pbrp-default.xml .repo/local_manifests/pbrp-default.xml
          echo "Initialization complete!"
          
      - name: Repo Sync
        run: |
          cd work
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Clone Device Tree
        run: |
          cd work
          git clone ${{ github.server_url }}/${{ github.repository }} -b pbrp-12.1 device/tecno/le7n

      - name: Building PBRP
        run: |
          cd work
          . build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch pb_tecno_le7n-eng
          mka pbrp -j$(nproc --all)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-SilverFox-le7n
          path: work/out/target/product/le7n/*.img
